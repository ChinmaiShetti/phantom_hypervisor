name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test & validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -v

      - name: Validate application configuration
        env:
          APP_ENV: production
        run: |
          # Production must refuse to start without secrets...
          if python -c "from server.main import create_app" 2>/dev/null; then
            echo "::error::server started in production without secrets"; exit 1
          fi
          # ...and must start with freshly generated ones.
          eval "$(python scripts/generate_keys.py --print | grep -v '^#' | sed 's/^/export /')"
          DATA_DIR=$(mktemp -d) python -c "from server.main import app; print('app OK:', app.title)"
          docker compose config --quiet && echo "docker-compose.yml OK"

  docker:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build server image
        run: docker build -f server/Dockerfile -t phantom-server:ci .
      - name: Build client image
        run: docker build -f client/Dockerfile -t phantom-client:ci .
      - name: Smoke test server container
        run: |
          # development mode: the container generates throwaway keys in its own /data
          docker run -d --name smoke -p 8000:8000 -e APP_ENV=development phantom-server:ci
          for i in $(seq 1 20); do curl -fsS http://localhost:8000/health && break; sleep 1; done
          curl -fsS http://localhost:8000/health | grep '"status":"ok"'
          docker image ls phantom-server:ci phantom-client:ci
